server:
  host: 127.0.0.1
  port: 8080
  db_path: var/agentmesh.db
  # Never commit real tokens. Resolve at startup from env:VAR or file:PATH.
  # e.g. ["env:AGENTMESH_API_KEY"] or ["file:/run/secrets/agentmesh_key"].
  # Empty means open mode (development only).
  api_keys: []
  lease_ttl_s: 30
  heartbeat_timeout_s: 45
  maintenance_interval_s: 2
  max_global_running: 512
  tenant_max_concurrent: 64
  max_task_timeout_s: 86400
  max_submissions_per_minute: 600
  log_level: INFO
  json_logs: true

worker:
  control_url: http://127.0.0.1:8080
  token: ""
  pool: default
  slots: 8
  cpu_total: 8
  memory_mb_total: 16384
  capabilities: []
  labels:
    zone: local
  backend: auto          # auto | docker | firecracker | fake
  workdir: var/workers
  heartbeat_interval_s: 5
  lease_wait_s: 5
  log_tail_bytes: 16384
  docker:
    proxy_image: python:3.12-alpine
    proxy_port: 3128
    egress_network: agentmesh-egress
    uplink_network: agentmesh-uplink
    egress_token: ""
    run_as_user: "10001:10001"
    shm_size_mb: 64
    pull_images: false
    seccomp_profile: null
    allowed_images:
      - python:3.12-slim
      - python:3.11-slim
      - node:22-slim
      - ubuntu:24.04
      - debian:12-slim
      - golang:1.23
  firecracker:
    enabled: false
    firecracker_bin: /usr/local/bin/firecracker
    kernel_image: /var/lib/agentmesh/vmlinux
    rootfs_image: /var/lib/agentmesh/rootfs.ext4
    run_root: /srv/agentmesh/firecracker
    vcpu: 2
    memory_mb: 1024
    guest_agent_port: 52000

catalog:
  # Model metadata source for the dashboard "import ollama" button.
  ollama_url: http://127.0.0.1:11434
  # Loopback-only by default so the control plane cannot be used as an SSRF pivot.
  allow_remote_ollama: false
  openrouter_url: https://openrouter.ai/api/v1/models

agents:
  commands:
    claude: ["claude", "-p", "{prompt}", "--output-format", "text"]
    codex: ["codex", "exec", "--full-auto", "{prompt}"]
    opencode: ["opencode", "run", "{prompt}"]
    ollama: ["ollama", "run", "{model}", "{prompt}"]
  env:
    # Reach a host-side Ollama from the sandbox. On Docker Desktop use
    # http://host.docker.internal:11434; on Linux the host gateway address.
    # The sandbox still needs network access to that endpoint.
    OLLAMA_HOST: http://127.0.0.1:11434
