name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  loadgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Rust load generator
        run: cargo check --locked --manifest-path tools/loadgen/Cargo.toml

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Verify CLI
        run: |
          agentmesh --version
          agentmesh init --path /tmp/agentmesh.yaml
